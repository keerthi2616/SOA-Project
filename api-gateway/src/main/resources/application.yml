server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates: [Path=/api/auth/**]
            - id: parking-service
              uri: lb://PARKING-SERVICE
              predicates: [Path=/api/parking/**]
            - id: booking-service
              uri: lb://BOOKING-SERVICE
              predicates: [Path=/api/bookings/**]
            - id: billing-service
              uri: lb://BILLING-SERVICE
              predicates: [Path=/api/billing/**]
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
  security:
    oauth2:
      resourceserver:
        jwt: {}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
jwt:
  secret: ${JWT_SECRET:ParkGrid-Demo-Secret-Key-Change-Me-2026-Long}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
