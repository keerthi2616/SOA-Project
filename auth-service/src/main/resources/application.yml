server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:file:./data/authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
jwt:
  secret: ${JWT_SECRET:ParkGrid-Demo-Secret-Key-Change-Me-2026-Long}
  expiration-ms: 3600000
management:
  endpoints:
    web:
      exposure:
        include: health,info
