server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: parking-service
  datasource:
    url: jdbc:h2:file:./data/parkingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
jwt:
  secret: ${JWT_SECRET:ParkGrid-Demo-Secret-Key-Change-Me-2026-Long}
management:
  endpoints:
    web:
      exposure:
        include: health,info
